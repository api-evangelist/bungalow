  /listings/properties/{id_or_slug}:
    get:
      operationId: /listings/properties/{id_or_slug}
      description: 'Get listing information for a single property. Can query by `id` or `slug`. This endpoint

        returns a richer level of information than the `list` endpoint.'
      parameters:
      - name: id_or_slug
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: integer
                  slug:
                    type: string
                  headline:
                    type:
                    - string
                    - 'null'
                  is_coming_soon:
                    type: boolean
                  coming_soon_date:
                    type: string
                    format: date
                  num_bathrooms:
