openapi: 3.2.0
info:
  title: Bungalow Listings API
  version: ''
  description: '# Getting Started


    If you are looking to integrate Bungalow''s property listings, we provide a number of helpful endpoints.'
  x-logo:
    url: https://assets.bungalow.com/logos/bungalow_wordmark_dark.png
    altText: Bungalow wordmark
servers:
- url: https://fieldstone.bungalow.com/api/v1/
tags:
- name: Listings
  description: Listings endpoints allow you to get all listings in a market or a singular property.
  x-order: 2
paths:
  /listings/properties/:
    get:
      operationId: /listings/properties/
      description: 'This endpoint allows you to get a list of all marketable properties for a given market.

        Co-living addresses are obfuscated for privacy reasons, as is the fidelity of latitude and longitude.

        Full addresses are provided for whole-home rentals, in the `street_address` field.

        Note that availability dates in the past are treated as today, to allow for more desirable

        sorting, without affecting the sorting of future availability.'
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: marketing_type
        required: false
        in: query
        description: marketing_type
        schema:
          type: string
          enum:
          - group_living
          - co_living
      - name: available_room_count
        required: false
        in: query
        description: available_room_count
        schema:
          type: string
      - name: total_room_count
        required: false
        in: query
        description: total_room_count
        schema:
          type: string
      - name: earliest_marketable_room
        required: false
        in: query
        description: earliest_marketable_room
        schema:
          type: string
      - name: earliest_available_date_or_today
        required: false
        in: query
        description: earliest_available_date_or_today
        schema:
          type: string
      - name: market__slug
        required: true
        in: query
        description: Slug-formatted market, e.g. bay-area, seattle, los-angeles. Use the `/markets` endpoint to get a list of all options.
        schema:
          type: string
      - name: neighborhood__slug
        required: false
        in: query
        description: slug formatted neighborhood, e.g hells-kitchen
        schema:
          type: string
      - name: is_coming_soon
        required: false
        in: query
        description: options are `true` or `false` (implicit default)
        schema:
          type: string
      - name: is_featured
        required: false
        in: query
        description: options are `true` or `false` (implicit default)
        schema:
          type: string
      - name: master_bedroom
        required: false
        in: query
        description: master_bedroom
        schema:
          type: string
      - name: private_bathroom
        required: false
        in: query
        description: private_bathroom
        schema:
          type: string
      - name: dryer
        required: false
        in: query
        description: dryer
        schema:
          type: string
      - name: washer
        required: false
        in: query
        description: washer
        schema:
          type: string
      - name: backyard
        required: false
        in: query
        description: backyard
        schema:
          type: string
      - name: pool
        required: false
        in: query
        description: pool
        schema:
          type: string
      - name: pet_friendly
        required: false
        in: query
        description: pet_friendly
        schema:
          type: string
      - name: max_price
        required: false
        in: query
        description: max_price
        schema:
          type: string
      - name: min_price
        required: false
        in: query
        description: min_price
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 123
                  next:
                    type:
                    - string
                    - 'null'
                  previous:
                    type:
                    - string
                    - 'null'
                  results:
                    type: array
                    items:
                      properties:
                        id:
                          type: integer
                        slug:
                          type: string
                        headline:
                          type:
                          - string
                          - 'null'
                        is_coming_soon:
                          type: boolean
                        coming_soon_date:
                          type: string
                          format: date
                        num_bathrooms:
                          type: number
                          multipleOf: 0.1
                          maximum: 100
                          minimum: -100
                        sqft:
                          type: integer
                        address:
                          properties:
                            city:
                              type: string
                              maxLength: 128
                            county:
                              type: string
                              maxLength: 128
                            neighborhood:
                              type: string
                              readOnly: true
                            latitude:
                              type: number
                              multipleOf: 0.001
                              maximum: 1000000
                              minimum: -1000000
                            longitude:
                              type: number
                              multipleOf: 0.001
                              maximum: 1000000
                              minimum: -1000000
                          required:
                          - latitude
                          - longitude
                          type: object
                          readOnly: true
                        street_address:
                          type: string
                          readOnly: true
                        market:
                          properties:
                            id:
                              type: integer
                              readOnly: true
                            internal_name:
                              type: string
                              maxLength: 256
                            display_name:
                              type: string
                              maxLength: 256
                            slug:
                              type:
                              - string
                              - 'null'
                              maxLength: 50
                              pattern: ^[-a-zA-Z0-9_]+$
                            email:
                              type: string
                              description: Market specific email i.e la@bungalow.com which accepts messages from robots
                              maxLength: 128
                            region:
                              type: string
                              maxLength: 64
                            region_code:
                              type: string
                              maxLength: 3
                            country:
                              type: string
                              maxLength: 128
                            country_code:
                              type: string
                              description: Alpha-2 ISO 3166 code
                              maxLength: 2
                            img:
                              type: string
                              format: uri
                              maxLength: 200
                              pattern: "^(?:[a-z0-9\\.\\-\\+]*)://(?:[^\\s:@/]+(?::[^\\s:@/]*)?@)?(?:(?:0|25[0-5]|2[0-4]\\d|1\\d?\\d?|[1-9]\\d?)(?:\\.(?:0|25[0-5]|2[0-4]\\d|1\\d?\\d?|[1-9]\\d?)){3}|\\[[0-9a-f:\\.]+\\]|([a-z¡-\uFFFF0-9](?:[a-z¡-\uFFFF0-9-]{0,61}[a-z¡-\uFFFF0-9])?(?:\\.(?!-)[a-z¡-\uFFFF0-9-]{1,63}(?<!-))*\\.(?!-)(?:[a-z¡-\uFFFF-]{2,63}|xn--[a-z0-9]{1,59})(?<!-)\\.?|localhost))(?::\\d{2,5})?(?:[/?#][^\\s]*)?\\Z"
                            img_md:
