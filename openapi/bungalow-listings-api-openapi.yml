                        description: Market specific email i.e la@bungalow.com which accepts messages from robots
                        maxLength: 128
                      region:
                        type: string
                        maxLength: 64
                      region_code:
                        type: string
                        maxLength: 3
                      country:
                        type: string
                        maxLength: 128
