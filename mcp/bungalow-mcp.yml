tools:
- name: list_markets
  description: List all active Bungalow markets (US metros) with geo bounds, timezone and rent premiums.
  source_operation: openapi/bungalow-openapi-original.yml#/markets/
  method: GET
  path: /markets/
  input_schema_source: operation parameters (limit, offset)
  read_only: true
- name: get_market
  description: Get full detail for a single market, including demand metrics.
  source_operation: openapi/bungalow-openapi-original.yml#/markets/{id}
  method: GET
  path: /markets/{id}
  input_schema_source: operation parameters (id)
  read_only: true
- name: search_listings
  description: List marketable properties in a market, filterable by neighborhood, marketing type (co_living/group_living),
    price range, room counts, availability date and amenities.
  source_operation: openapi/bungalow-openapi-original.yml#/listings/properties/
  method: GET
  path: /listings/properties/
  input_schema_source: operation parameters — 19 total; market__slug is REQUIRED, so an agent must call
    list_markets first
  read_only: true
- name: get_listing
  description: Get the rich detail record for one property by id or slug.
  source_operation: openapi/bungalow-openapi-original.yml#/listings/properties/{id_or_slug}
  method: GET
  path: /listings/properties/{id_or_slug}
  input_schema_source: operation parameters (id_or_slug)
  read_only: true
- name: get_showing_availability
  description: Retrieve the bookable showing timeslot grid for a property.
  source_operation: openapi/bungalow-openapi-original.yml#/listings/showings/availability/{id}/
  method: GET
  path: /listings/showings/availability/{id}/
  input_schema_source: operation parameters (id, limit, offset, is_virtual, is_soon)
  read_only: true
- name: book_showing
  description: Book a property showing (in-person or virtual) in an available timeslot.
  source_operation: openapi/bungalow-openapi-original.yml#/listings/showings/
  method: POST
  path: /listings/showings/
  input_schema_source: 'requestBody — required: property, start_time, end_time'
  read_only: false
  consequence: Creates a real-world appointment with a Bungalow showing agent and triggers messaging to
    the attendee. NOT idempotent — a repeat call books a second showing. Requires human confirmation.
- name: submit_application_source
  description: Create an application source (lead) and receive a public application URL.
  source_operation: openapi/bungalow-openapi-original.yml#/applications/source/
  method: POST
  path: /applications/source/
  input_schema_source: 'requestBody — required: first_name, last_name, email, market'
  read_only: false
  consequence: Submits a named individual's personal data into Bungalow's leasing funnel. NOT idempotent.
    Requires human confirmation and explicit consent from the person named.
agent_notes:
  entry_point: list_markets is the mandatory first call — search_listings requires market__slug and there
    is no global property enumeration.
  pricing_branch: 'Branch on property_marketing_type: group_living -> full_property_price; co_living ->
    room_prices.'
  freshness: Listing data refreshes about every 10 minutes; do not cache longer than 24 hours.
  privacy: Co-living street addresses and lat/long are deliberately obfuscated by the provider. Do not
    attempt to re-identify them.
  syndication: Bungalow asks that third-party surfaces only post a listing when the earliest availability
    date is less than 30 days out.
  no_idempotency: Neither write tool has an idempotency key. On a network timeout, re-read (get_showing_availability)
    before retrying rather than re-POSTing.
