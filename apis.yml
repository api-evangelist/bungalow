apis:
- name: Bungalow API
  description: >-
    Anonymous, read-mostly public REST API for syndicating Bungalow's residential rental inventory.
    Covers markets (23 active US metros with geo bounds, timezone and rent premiums), marketable
    property listings filtered by market slug, neighborhood, amenities and price, single-property
    detail by id or slug, showing-availability grids, showing creation, and application-source
    submission. JSON over HTTPS with limit/offset pagination, a structured error envelope, and URI
    path versioning (/api/v1/). Authenticated Hotpads and Facebook Catalog XML feeds are available to
    approved partners via integrations@bungalow.com.
  humanURL: https://fieldstone.bungalow.com/api/v1/docs/
