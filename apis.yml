aid: bungalow
name: Bungalow
description: >-
  Bungalow is a US residential rental platform for single-family homes, operating both a co-living
  ("Coliving Home") product where individual rooms in a house are leased to separately screened
  housemates and a whole-home ("Group Home") product leased to a single group. Founded in 2017 by
  Andrew Collins and Justin McCarty and headquartered in Miami, FL, the company pairs a renter-facing
  marketplace and mobile app with a homeowner property-management portal and an SFR investment service
  ("Radar Powered by Bungalow") covering sourcing, underwriting, renovation and management. Bungalow
  publishes a small, anonymous, read-mostly public REST API — the Bungalow API at
  fieldstone.bungalow.com — so that third-party listing sites, rental search portals and partner
  platforms can syndicate its markets and property listings, retrieve showing availability, book a
  showing, and submit an application source. Authenticated Hotpads and Facebook Catalog XML feeds are
  offered to approved integration partners as a richer alternative, and partners are asked to post
  lead-capture webhooks back to Bungalow. Active in roughly 23 markets across the United States.
